    <main class="main-report">
      <header class="report-page-head">
        <h2 class="page-heading">报告查询</h2>
        <p class="report-back">
          <a class="link-back" href="index.html#query">返回报告查询</a>

    <script src="site-path.js"></script>
    <script>
      loadReportsScript(function (err) {
        var root = document.getElementById("report-root");
        if (!root) return;

        if (err) {
          root.innerHTML = reportsLoadErrorHtml();
          return;
        }

        var params = new URLSearchParams(window.location.search);
        var no = normalizeReportNo(params.get("no") || "");

        if (!no) {
          root.innerHTML =
            '<p class="not-found">请从首页「报告查询」输入编号查询，或在地址栏附带参数，如 report.html?no=2026-0810038118</p>';
          return;
        }

        var row = REPORT_DB[no];
        if (!row) {
          root.innerHTML =
            '<p class="not-found">未找到编号为「' +
            escapeHtmlReport(no) +
            "」的报告信息，请核对编号后重试。</p>";
          return;
        }

        root.innerHTML = renderReportTable(no, row);
        document.title = "报告 " + no + " - 重庆市计量质量检测研究院";
      });
    </script>
  </body>
</html>
