    <script src="reports.js?v=20260308"></script>
    <script>
      (function () {
        var form = document.getElementById("query-form");
        var input = document.getElementById("report-no");
        var root = document.getElementById("report-result");
        if (!form || !input || !root) return;

        function showMessage(html, isError) {
          root.classList.toggle("is-error", !!isError);
          root.innerHTML = html;
        }

        function runQuery(raw, pushUrl) {
          var no = normalizeReportNo(raw);
          if (!no) {
            showMessage(
              '<p class="not-found">请输入报告编号后再查询。</p>',
              true
            );
            return;
          }
          var row = REPORT_DB[no];
          if (!row) {
            showMessage(
              '<p class="not-found">未找到编号为「' +
                escapeHtmlReport(no) +
                "」的报告信息，请核对编号后重试。</p>",
              true
            );
            return;
          }
          showMessage(renderReportTable(no, row), false);
          if (pushUrl && window.history && history.replaceState) {
            history.replaceState(
              null,
              "",
              "?no=" + encodeURIComponent(no) + "#query"
            );
          }
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          runQuery(input.value, true);
          root.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });

        (function initFromUrl() {
          var params = new URLSearchParams(window.location.search);
          var q = params.get("no");
          if (q) {
            input.value = q;
            runQuery(q, false);
          }
        })();
      })();
    </script>
